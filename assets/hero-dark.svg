<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" fill="none" role="img">
<style>

.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;} .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;}
.fade{opacity:0;animation:fadeIn .45s ease-out forwards;}
@keyframes fadeIn{to{opacity:1}}
.type{animation:type .9s steps(8,end) .35s forwards;}
@keyframes type{to{transform:translateX(78px)}}
.blink{animation:blink 1s steps(1,end) infinite;}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.glow{animation:glow 6s ease-in-out infinite;}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.sheen{animation:sheen 5s linear infinite;}
@keyframes sheen{0%{transform:translateX(-300px)}100%{transform:translateX(1100px)}}

</style>
<defs>
  <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#0F1626"/></linearGradient>
  <radialGradient id="glowG" cx="0.85" cy="0.05" r="0.6"><stop offset="0" stop-color="#F5C451" stop-opacity="0.18"/><stop offset="1" stop-color="#F5C451" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#7AA2F7" stop-opacity="0.13"/><stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/></radialGradient>
  <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5C451"/><stop offset="1" stop-color="#E09F2E"/></linearGradient>
  <linearGradient id="sheenG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5C451" stop-opacity="0"/><stop offset=".5" stop-color="#F5C451" stop-opacity=".9"/><stop offset="1" stop-color="#F5C451" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#1A2234"/></pattern>
  <clipPath id="outer"><rect width="900" height="660" rx="20"/></clipPath>
</defs>
<g clip-path="url(#outer)">
<rect width="900" height="660" fill="url(#bgG)"/>
<rect width="900" height="660" fill="url(#dots)"/>
<rect class="glow" width="900" height="660" fill="url(#glowG)"/>
<rect width="900" height="660" fill="url(#glowB)"/>
<rect class="sheen" x="0" y="0" width="260" height="2" fill="url(#sheenG)"/>
</g>
