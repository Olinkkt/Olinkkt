600" letter-spacing="0" fill="#a09cb8" text-anchor="start" opacity="1">Rust</text><rect x="480" y="84" width="200" height="100" rx="16" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity=".12"/><rect x="500" y="104" width="28" height="4" rx="2" fill="#7c5cff"/><text x="500" y="142" font-family="-apple-system, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#f5f3ff" text-anchor="start" opacity="1">Web apps</text><text x="500" y="166" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0" fill="#a09cb8" text-anchor="start" opacity="1">tools, TypeScript</text><rect x="692" y="84" width="200" height="100" rx="16" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity=".12"/><rect x="712" y="104" width="28" height="4" rx="2" fill="#ff4ecd"/><text x="712" y="142" font-family="-apple-system, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#f5f3ff" text-anchor="start" opacity="1">Realtime</text><text x="712" y="166" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0" fill="#a09cb8" text-anchor="start" opacity="1">websockets</text></g><rect x=".75" y=".75" width="898.5" height="208.5" rx="23.5" fill="none" stroke="url(#esk)" stroke-width="1.5"/></svg>