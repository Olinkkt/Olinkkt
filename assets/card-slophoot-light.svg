<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B7791F" stop-opacity="0"/><stop offset=".5" stop-color="#B7791F"/><stop offset="1" stop-color="#B7791F" stop-opacity="0"/></linearGradient>
<clipPath id="cc"><rect x="1" y="1" width="438" height="234" rx="15"/></clipPath>
</defs>
